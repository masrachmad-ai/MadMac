# =====================================================================
#  MADMAC — FILE ATURAN BOT
#  Ini SATU-SATUNYA file yang perlu Anda baca/ubah. Tidak perlu coding.
#  Baris yang diawali tanda # adalah penjelasan, bot mengabaikannya.
#  Setelah mengubah file ini, restart bot (docs/DEPLOY.md, langkah 8).
# =====================================================================

# --- MODE -------------------------------------------------------------
# "testnet" = uang mainan (testnet.binancefuture.com). AMAN.
# "live"    = uang asli. Bot TETAP menolak trading live sampai Anda
#             mengetik "go live" di Telegram. Mengubah baris ini saja
#             tidak cukup — itu disengaja.
# Catatan: sinyal SELALU dihitung dari data pasar Binance ASLI, juga di
# testnet. Hanya order-nya yang dikirim ke testnet.
mode: testnet

# --- MARKET -----------------------------------------------------------
# Binance Futures USDⓈ-M. Daftar awal = 10 koin likuid (pilihan bawaan,
# silakan ubah). Pasangan strategi+koin yang TIDAK lulus Lab tidak akan
# pernah di-trade.
symbols:
  - BTCUSDT
  - ETHUSDT
  - SOLUSDT
  - BNBUSDT
  - XRPUSDT
  - DOGEUSDT
  - ADAUSDT
  - AVAXUSDT
  - LINKUSDT
  - LTCUSDT
timeframe: 5m            # 1m tidak disarankan: fee ≈ seluruh jarak stop

# --- IZIN TRADE -------------------------------------------------------
# Keputusan Anda (23 Nov 2026): "auto" di testnet DAN live.
# "auto"      = bot masuk sendiri selama SEMUA aturan Shield lolos.
#               Uang asli tetap butuh "go live" di Telegram.
# "per_trade" = setiap sinyal menunggu tombol ✅ / ❌ di Telegram.
approval: auto
approval_timeout_seconds: 90   # hanya dipakai jika per_trade
# Pesan Telegram untuk SETIAP trade? false = hanya alarm + laporan harian.
notify_each_trade: false

# --- CARA MASUK -------------------------------------------------------
# "maker" = limit order post-only di harga sinyal → fee lebih murah,
#           tapi sebagian order tidak terisi (itu normal).
# "taker" = market order → pasti masuk, fee lebih mahal.
entry_order: maker
entry_timeout_candles: 1       # limit yang belum terisi dibatalkan setelah N candle
max_entry_drift_pct_of_stop: 30

# --- RISIKO -----------------------------------------------------------
# Diubah 23 Nov 2026 atas keputusan Anda: dari 2% / 20x ke 0,5% / 10x.
risk_per_trade_pct: 0.5        # % modal yang hilang jika stop kena
max_leverage: 10               # batas KERAS; leverage aktual dihitung otomatis
margin_type: ISOLATED          # rugi hanya sebatas margin posisi itu

# --- BANYAK KOIN SEKALIGUS --------------------------------------------
max_open_positions: 3          # keputusan Anda
max_total_open_risk_pct: 1.5   # total risiko SEMUA posisi digabung
# Hampir semua altcoin ikut BTC: 3 LONG sekaligus = 1 taruhan besar.
max_same_direction: 2

# --- REM DARURAT (Shield) ---------------------------------------------
daily_loss_limit_pct: 3.0      # stop total hari ini jika rugi ≥ 3%
max_consecutive_losses: 3      # stop total setelah 3 rugi beruntun (semua koin)
max_trades_per_day: 60
# Hari baru dimulai jam 00:00 UTC (= 07:00 WIB).

# --- FEE (ESTIMASI tarif VIP0 — cek di akun Binance Anda) -------------
maker_fee_pct: 0.02
taker_fee_pct: 0.05
slippage_pct: 0.02             # untuk order market & stop
max_fee_share_of_risk_pct: 25  # tolak trade jika fee > 25% dari risikonya

# --- KESEHATAN DATA ---------------------------------------------------
max_feed_age_seconds: 30

# --- POSISI TANPA STOP ------------------------------------------------
# true = bot BOLEH menutup posisi yang stop-nya gagal dipasang (izin tetap).
# false = hanya berhenti + alarm.
close_if_stop_fails: true

# --- STRATEGI ---------------------------------------------------------
# classic     : ema_pullback, rsi_reversion, range_breakout
# smart money : smc_sweep (sapu likuiditas), fvg_retest (fair value gap)
# derivatif   : bos_oi (break of structure + open interest + taker flow)
#               smc_sweep juga memakai open interest & funding sebagai filter
strategies:
  - smc_sweep
  - fvg_retest
  - bos_oi
  - ema_pullback
  - rsi_reversion
  - range_breakout

# --- SYARAT LULUS LAB (per koin per strategi, SETELAH fee) ------------
lab:
  months_of_data: 6
  out_of_sample_pct: 30          # 30% data terakhir tidak pernah "dilihat"
  min_trades: 100
  min_profit_factor: 1.15        # di data out-of-sample
  max_drawdown_pct: 20           # Monte Carlo, skenario buruk 95%
  min_win_rate_pct: 0            # 0 = tidak dicek
  folds: 6                       # data dibagi 6 periode...
  min_positive_folds_pct: 60     # ...minimal 60% periode harus untung
  false_discovery_rate: 0.10     # koreksi karena banyak strategi diuji
  random_baseline_draws: 3000    # harus lebih baik dari entry acak
  monte_carlo_runs: 1000

# --- LAPORAN ----------------------------------------------------------
daily_report_hour_wib: 7
weekly_review_day: sunday
