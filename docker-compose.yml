services:
  bot:
    build: .
    container_name: madmac
    restart: unless-stopped        # restarts itself after any crash or server reboot
    env_file: .env                 # API keys live ONLY here, on the server
    volumes:
      - ./data:/app/data           # journal, Lab results, history cache survive restarts
      - ./config.yaml:/app/config.yaml:ro
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "5" }

